<style>
:root {
  --bancada: #141a21;
  --painel: #1b232c;
  --painel-2: #222c37;
  --linha: #2e3a47;
  --texto: #dde4eb;
  --suave: #8f9caa;
  --vermelho: #ff4a36;   /* laser 632,8 nm */

  --verde: #52c48d;

}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bancada); color: var(--texto);

  display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); overflow: hidden;
}
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }

/* ---------- topo ---------- */
.topo {
  display: flex; align-items: center; gap: 24px;
  padding: 10px 20px; border-bottom: 1px solid var(--linha);
}
.marca { display: flex; flex-direction: column; line-height: 1.15; }
.marca h1 { font: 600 21px/1.1 var(--din); margin: 0; letter-spacing: .01em; white-space: nowrap; }
.marca .serie { text-decoration: none; color: var(--suave); font: 500 12.5px var(--din); letter-spacing: .04em; white-space: nowrap; }
.marca h1 small { font: 400 15px var(--din); color: var(--suave); }
.espectro { width: 40px; height: 22px; flex: none; }
.modulos { display: flex; gap: 4px; margin-left: 16px; }
.modulos button {
  white-space: nowrap;
  background: none; border: 0; padding: 8px 14px; border-radius: 6px; cursor: pointer;
  color: var(--suave); font: 500 16px var(--din);
}
.modulos button[aria-current="true"] { color: var(--texto); background: var(--painel-2); }
.modulos button:hover { color: var(--texto); }
.modulos button[disabled] { opacity: .4; cursor: not-allowed; }
/* seletor de módulo: rótulo visível e cara de controle (não de aba), para não passar despercebido */
.seletor-unidade { margin-left: auto; display: flex; align-items: center; gap: 10px; position: relative; }
.rot-unidade { font: 500 13px var(--din); color: var(--suave); letter-spacing: .03em; }
.unidade {
  display: flex; border: 1px solid #3e4c5b; border-radius: 9px; padding: 3px; background: var(--painel);
}
.unidade button {
  white-space: nowrap; display: inline-flex; align-items: center; gap: 7px;
  background: none; border: 0; padding: 7px 14px; border-radius: 6px; cursor: pointer;
  color: var(--suave); font: 500 15px var(--din);
}
.unidade button:hover { color: var(--texto); background: var(--painel-2); }
.unidade button[aria-pressed="true"] { background: var(--azul); color: #0d1620; }
.unidade button[aria-pressed="true"] .u-extra { color: #0d1620; opacity: .75; }
.u-ico { width: 15px; height: 15px; flex: none; }
.unidade.chamando { animation: chamar 1.6s ease-in-out 4; }
@keyframes chamar { 0%, 100% { box-shadow: 0 0 0 0 rgba(58,160,255,0); } 50% { box-shadow: 0 0 0 5px rgba(58,160,255,.35); } }
@media (prefers-reduced-motion: reduce) { .unidade.chamando { animation: none; box-shadow: 0 0 0 3px rgba(58,160,255,.35); } }
.dica-unidade {
  position: absolute; top: calc(100% + 10px); right: 0; z-index: 40; width: 300px;
  background: var(--painel-2); border: 1px solid var(--azul); border-radius: 10px; padding: 12px 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,.45); font-size: 14.5px;
}
.dica-unidade::before { content: ""; position: absolute; top: -7px; right: 40px; width: 12px; height: 12px; background: var(--painel-2); border-left: 1px solid var(--azul); border-top: 1px solid var(--azul); transform: rotate(45deg); }
.dica-unidade p { margin: 0 0 10px; }
.dica-unidade[hidden] { display: none; }

main { min-height: 0; position: relative; }
.modulo { position: absolute; inset: 0; display: none; }
.modulo.ativo { display: grid; }
.rodape {
  padding: 6px 20px; font-size: 13px; color: var(--suave); border-top: 1px solid var(--linha);
  display: flex; justify-content: space-between; gap: 16px;
}

.link-aviso {
  background: none; border: 0; padding: 0; font: inherit; color: var(--texto);

dialog.aviso::backdrop { background: rgb(0 0 0 / .55); }

dialog.aviso .aviso-versao { color: var(--suave); font-size: 14px; margin-top: 14px; }
dialog.aviso form { display: flex; justify-content: flex-end; margin-top: 8px; }

  position: absolute; pointer-events: none; background: var(--painel-2); border: 1px solid var(--linha);

}

.controles-3d { z-index: 3; }
.controles-3d select { background: var(--painel-2); border: 1px solid var(--linha); border-radius: 6px; padding: 5px 8px; color: var(--texto); }
.vistas { display: flex; gap: 2px; background: var(--bancada); border: 1px solid var(--linha); border-radius: 8px; padding: 2px; }
.vistas button { background: none; border: 0; padding: 5px 11px; border-radius: 6px; cursor: pointer; color: var(--suave); font: 500 14.5px var(--din); white-space: nowrap; }
.vistas button:hover { color: var(--texto); }
.vistas button[aria-pressed="true"] { background: var(--painel-2); color: var(--texto); box-shadow: inset 0 -2px 0 var(--azul); }
.rotulos { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
.mk {
  display: inline-grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: 50%;
  font: 600 12.5px/1 var(--din); background: var(--painel); color: var(--texto); border: 1.5px solid var(--suave);
}
.mk.luz { border-color: var(--vermelho); color: #ffb4a9; }
.mk.amostra { border-color: var(--ambar); color: var(--ambar); }
.rotulos .mk { position: absolute; left: 0; top: 0; padding: 0; pointer-events: auto; cursor: pointer; box-shadow: 0 1px 6px rgba(0,0,0,.55); }
.rotulos .mk.ativo, .leg-3d button.ativo .mk { background: var(--azul); border-color: var(--azul); color: #fff; }
.leg-tit { font: 600 15px var(--din); margin: 20px 0 2px; }
.leg-3d { list-style: none; margin: 6px 0 0; padding: 0; }
.leg-3d button {

}
.leg-3d button:hover, .leg-3d button.ativo { background: var(--painel-2); }
.leg-3d strong { display: block; font: 600 14.5px var(--din); color: var(--texto); margin-bottom: 1px; }
.voltar-leg { padding: 6px 12px; font-size: 14px; margin-bottom: 12px; }
.config-3d {

.config-3d.so-botao { background: none; border: 0; padding: 0; }
.nome-curto { display: none; }
.proc-barra { height: 4px; background: var(--painel-2); border-radius: 2px; margin: 4px 0 14px; overflow: hidden; }
.proc-barra i { display: block; height: 100%; background: var(--azul); transition: width .3s; }
.proc-alerta { border-left: 3px solid var(--ambar); background: var(--painel-2); padding: 8px 10px; border-radius: 6px; font-size: 14px; }
.proc-nav { display: flex; gap: 8px; margin-top: 14px; }
.proc-nav .btn { flex: 1; }
table.manut td { font: 400 13.5px var(--corpo); text-align: left; padding: 6px 4px; vertical-align: top; }
table.manut td:last-child { color: var(--suave); }
.sem-webgl { pointer-events: none; position: absolute; inset: 0; display: grid; place-items: center; padding: 40px; text-align: center; color: var(--suave); }

.lateral { border-left: 1px solid var(--linha); background: var(--painel); overflow: auto; padding: 20px; }
.lateral h2 { font: 600 22px/1.2 var(--din); margin: 4px 0 4px; }
.grupo-peca { color: var(--suave); font-size: 14px; }
.ficha dt { font: 600 14px var(--din); color: var(--suave); margin-top: 16px; }
.ficha dd { margin: 4px 0 0; }
.todas-pecas { margin-top: 24px; border: 0; border-top: 1px solid var(--linha); border-radius: 0; padding: 12px 0 0; }
.todas-pecas > summary { font: 600 15px var(--din); color: var(--suave); padding: 4px 0; }
.todas-pecas[open] > summary { color: var(--texto); }
.lista-pecas { margin-top: 4px; }
.lista-pecas h3 { font: 600 14px var(--din); color: var(--suave); margin: 14px 0 6px; }
.lista-pecas button {
  display: block; width: 100%; text-align: left; background: none; border: 0; padding: 5px 8px;
  border-radius: 5px; cursor: pointer; color: var(--texto);
}
.lista-pecas button:hover { background: var(--painel-2); }
.lista-pecas button[aria-current="true"] { background: var(--painel-2); box-shadow: inset 2px 0 0 var(--azul); }
.vazio { color: var(--suave); }

details { margin-top: 16px; border: 1px solid var(--linha); border-radius: 8px; padding: 10px 12px; }
details summary { cursor: pointer; font: 600 15px var(--din); color: var(--azul); }
details p { margin: 8px 0 0; }

/* ---------- M2: jornada ---------- */
#m-jornada { grid-template-columns: 1fr 460px; grid-template-rows: 1fr auto; }
#m-jornada .palco { grid-row: 1; background: #10151b; }
#m-jornada .lateral { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-direction: column; }
#m-jornada .navegacao { position: sticky; bottom: -20px; background: var(--painel); padding-bottom: 16px; }
.passo-num { color: var(--suave); font: 500 14px var(--din); }
.passo-titulo { font: 600 26px/1.2 var(--din); margin: 4px 0 12px; }
.navegacao { display: flex; gap: 8px; margin-top: auto; padding-top: 20px; }
.btn {
  background: var(--painel-2); border: 1px solid var(--linha); padding: 9px 16px; border-radius: 7px;
  cursor: pointer; font: 500 15px var(--din);
}
.btn:hover { border-color: var(--suave); }
.btn.primario { background: var(--texto); color: var(--bancada); border-color: var(--texto); }
.btn[disabled] { opacity: .35; cursor: default; }
.trilha {
  grid-row: 2; grid-column: 1; display: flex; gap: 6px; padding: 12px 16px;
  border-top: 1px solid var(--linha); overflow-x: auto;
}
.trilha button {
  flex: 0 0 44px; min-height: 44px; background: none; border: 0; border-top: 3px solid var(--linha);
  padding: 8px 4px 2px; text-align: left; cursor: pointer; color: var(--suave); font-size: 14px; line-height: 1.3;
}
.trilha button b { display: block; font: 600 15px var(--din); }
.trilha button span { display: none; }
.trilha button[aria-current="true"] { flex: 1 0 180px; }
.trilha button[aria-current="true"] span { display: block; }
.trilha button.feito { border-top-color: color-mix(in srgb, var(--vermelho) 45%, var(--linha)); }
.trilha button[aria-current="true"] { border-top-color: var(--vermelho); color: var(--texto); }

#m-jornada .palco { position: relative; }
.controle-anim {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 12px; align-items: center;
  background: var(--painel); border: 1px solid var(--linha); border-radius: 10px; padding: 8px 14px; font-size: 14px;
}
.controle-anim[hidden] { display: none; }
.controle-anim label { white-space: nowrap; }
.controle-anim input { width: 260px; accent-color: var(--vermelho); }
.controle-anim output { font: 600 16px var(--din); min-width: 150px; font-variant-numeric: tabular-nums; }
h3.sub { font: 600 15px var(--din); color: var(--suave); margin: 18px 0 6px; }
.extras { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
.extra { background: none; border: 1px solid var(--linha); border-radius: 16px; padding: 6px 12px; cursor: pointer; color: var(--suave); font: 500 14px var(--din); min-height: 36px; }
.extra:hover { color: var(--texto); }
.extra[aria-expanded="true"] { background: var(--painel-2); color: var(--texto); border-color: var(--suave); }
.painel-extra { margin-top: 10px; background: var(--painel-2); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.painel-extra p { margin: 0; }
.painel-sw { border-left: 3px solid var(--azul); }
.painel-erros { border-left: 3px solid var(--ambar); }
.btn.testar { margin-top: 18px; width: 100%; }
ul.pontos { margin: 0; padding-left: 18px; }
ul.pontos li { margin: 4px 0; }
ul.erros li::marker { color: var(--ambar); }
.caixa-software { margin-top: 16px; background: var(--painel-2); border-radius: 8px; padding: 10px 12px; border-left: 3px solid var(--azul); }
.caixa-software b { font: 600 14px var(--din); color: var(--azul); }
.caixa-software p { margin: 4px 0 0; font-size: 14px; }
.quiz { margin-top: 18px; border: 1px solid var(--linha); border-radius: 8px; padding: 12px; }
.quiz p { margin: 0 0 8px; }
.opcoes { display: grid; gap: 6px; }
.opcao { text-align: left; background: var(--painel-2); border: 1px solid var(--linha); border-radius: 6px; padding: 8px 10px; cursor: pointer; }
.opcao:hover:not([disabled]) { border-color: var(--suave); }
.opcao.certa { border-color: var(--verde); }
.opcao.errada { border-color: var(--vermelho); }
.opcao[disabled] { cursor: default; }
.feedback { font-size: 14px; }

/* ---------- M3: laboratório ---------- */
#m-lab { grid-template-columns: 330px 1fr 340px; }
.ajustes { background: var(--painel); border-right: 1px solid var(--linha); overflow: auto; padding: 18px; }
.ajustes h2, .leitura h2 { font: 600 18px var(--din); margin: 0 0 10px; }
.campo { margin: 14px 0; }
.campo label { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.campo label output { font: 600 15px var(--din); font-variant-numeric: tabular-nums; }
.campo input[type=range] { width: 100%; accent-color: var(--vermelho); }
.campo select {
  width: 100%; margin-top: 4px; background: var(--painel-2); border: 1px solid var(--linha);
  border-radius: 6px; padding: 7px 8px;
}
.campo small { color: var(--suave); font-size: 14px; display: block; margin-top: 2px; }
.campo small.fora-faixa { color: var(--ambar); }
.campo small[hidden] { display: none; }
.secao-ajuste { border-top: 1px solid var(--linha); margin-top: 18px; padding-top: 4px; }
.secao-ajuste > b { display: block; font: 600 14px var(--din); color: var(--suave); margin-top: 12px; }

.area-grafico { display: grid; grid-template-rows: minmax(150px, 40%) minmax(0, 1fr) auto; min-width: 0; min-height: 0; padding: 14px 18px 10px; gap: 8px; }
.vista-amostra { position: relative; background: #10151b; border: 1px solid var(--linha); border-radius: 10px; min-height: 0; }
.vista-amostra canvas { position: absolute; inset: 0; }
.area-grafico .intro { color: var(--suave); font-size: 14px; max-width: 75ch; margin: 0; }
.grafico { position: relative; min-height: 0; }
.grafico canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.legenda { display: flex; gap: 20px; font-size: 14px; color: var(--suave); flex-wrap: wrap; }
.legenda .comparar { display: flex; gap: 6px; align-items: center; color: var(--texto); cursor: pointer; }
.legenda .comparar input { accent-color: var(--azul); }
table.modelos { margin-top: 16px; }
table.modelos td { font-size: 15px; }
.legenda i { display: inline-block; width: 22px; height: 0; vertical-align: middle; margin-right: 6px; }

.leitura { background: var(--painel); border-left: 1px solid var(--linha); overflow: auto; padding: 18px; }
table.dv { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.dv th { font: 500 13px var(--din); color: var(--suave); text-align: right; padding: 4px 0; }
table.dv th:first-child, table.dv td:first-child { text-align: left; }
table.dv td { font: 600 18px var(--din); text-align: right; padding: 5px 0; border-top: 1px solid var(--linha); }
table.dv td.desvio { font-size: 15px; }
.ruim { color: var(--vermelho); } .medio { color: var(--ambar); } .bom { color: var(--verde); }
.medidor { margin-top: 18px; }
.medidor .topo-m { display: flex; justify-content: space-between; font-size: 14px; }
.medidor .topo-m b { font: 600 17px var(--din); }
.barra { position: relative; height: 10px; background: var(--painel-2); border-radius: 5px; margin-top: 6px; overflow: hidden; }
.barra .faixa { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--verde) 30%, transparent); }
.barra .valor { position: absolute; top: -2px; bottom: -2px; width: 3px; background: var(--texto); border-radius: 2px; }
.medidor small { color: var(--ambar); font-size: 14px; display: block; margin-top: 4px; }
.diagnosticos { list-style: none; padding: 0; margin: 18px 0 0; }
.diagnosticos li { padding: 10px 12px; border-radius: 8px; background: var(--painel-2); margin-bottom: 8px; font-size: 14px; border-left: 3px solid var(--suave); }
.diagnosticos li.erro { border-left-color: var(--vermelho); }
.diagnosticos li.atencao { border-left-color: var(--ambar); }
.diagnosticos li.ok { border-left-color: var(--verde); }

/* ---------- glossário ---------- */
#m-glossario { overflow: auto; }
.glossario { max-width: 980px; margin: 0 auto; padding: 24px 24px 40px; width: 100%; }
.glo-topo h2 { font: 600 26px var(--din); margin: 0; }
.glo-topo p { color: var(--suave); margin: 4px 0 14px; }
#glo-busca { width: 100%; background: var(--painel-2); border: 1px solid var(--linha); border-radius: 8px; padding: 10px 12px; }
.glo-cats { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 8px; }
.glo-cats button { background: none; border: 1px solid var(--linha); border-radius: 16px; padding: 5px 12px; cursor: pointer; color: var(--suave); font-size: 14px; }
.glo-cats button[aria-pressed="true"] { background: var(--painel-2); color: var(--texto); border-color: var(--suave); }
.glo-lista { margin: 8px 0 0; }
.glo-item { display: grid; grid-template-columns: 260px 1fr; gap: 20px; padding: 10px 0; border-top: 1px solid var(--linha); }
.glo-item dt { display: flex; flex-direction: column; gap: 2px; }
.glo-en { font: 600 16px var(--din); }
.glo-pt { color: var(--azul); font-size: 14px; }
.glo-item dd { margin: 0; }
.glo-item dd small { display: block; color: var(--suave); margin-top: 2px; font-size: 14px; }
.glo-item dd em { display: inline-block; margin-top: 4px; font-style: normal; font-size: 13px; color: var(--suave); border: 1px solid var(--linha); border-radius: 10px; padding: 1px 8px; }
@media (max-width: 1500px) { .marca h1 small { display: none; } }
@media (max-width: 1780px) { .modulos button[disabled] { display: none; } }
@media (max-width: 1280px) {
  #m-lab { grid-template-columns: 290px 1fr 290px; }
  #m-equip { grid-template-columns: 1fr 320px; }
  #m-jornada { grid-template-columns: 1fr 380px; }
}
/* elementos só do celular */
.lab-abas, .lab-mini { display: none; }

@media (max-width: 900px) {
  html, body { height: auto; }
  body { display: block; overflow-x: hidden; overflow-y: auto; font-size: 15px; }
  /* topo em duas linhas: marca + unidade; abas roláveis */
  .topo { flex-wrap: wrap; gap: 10px 12px; padding: 10px 14px 0; position: sticky; top: 0; z-index: 20; background: var(--bancada); }
  .espectro { width: 30px; }
  .marca { min-width: 0; flex: 1; }
  .marca h1 { font-size: 15px; white-space: normal; line-height: 1.15; }
  .u-extra { display: none; }
  .seletor-unidade { flex: none; gap: 6px; }
  .rot-unidade { display: none; }
  .unidade { padding: 2px; flex: none; }
  .unidade button { padding: 7px 10px; font-size: 14px; gap: 5px; }
  .dica-unidade { width: min(300px, calc(100vw - 28px)); }
  .modulos { order: 3; width: calc(100% + 28px); margin: 0 -14px; padding: 0 10px; overflow-x: auto; scrollbar-width: none; border-top: 1px solid var(--linha); }
  .modulos::-webkit-scrollbar { display: none; }
  .modulos button { padding: 10px 12px; border-radius: 0; font-size: 15px; border-bottom: 2px solid transparent; }
  .modulos { -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent); }
  .nome-longo { display: none; }
  .nome-curto { display: inline; }
  .modulos button[aria-current="true"] { background: none; border-bottom-color: var(--vermelho); }
  main { min-height: 0; }
  .modulo { position: static; }
  .modulo.ativo { display: block; }
  .lateral, .ajustes, .leitura { border: 0; border-top: 1px solid var(--linha); overflow: visible; padding: 18px 16px; }
  .rodape { gap: 12px; padding: 10px 16px 16px; }
  .link-aviso { padding: 12px 6px; margin: -12px -6px; }

  /* equipamento */
  #m-equip .palco { height: 58vh; min-height: 340px; }
  .config-3d { left: 10px; right: 10px; top: 10px; padding: 6px 10px; gap: 8px; }
  .config-3d label { font-size: 14px; flex: 1 1 140px; }
  .config-3d select { flex: 1; min-width: 0; }
  .controles-3d { left: 10px; right: 10px; bottom: 10px; flex-wrap: wrap; gap: 8px 14px; padding: 8px 10px; }
  .controles-3d label { font-size: 14px; }
  .vistas { flex: 1 1 100%; }
  .vistas button { flex: 1; padding: 6px 4px; font-size: 13.5px; }
  .controles-3d select { flex: 1; min-width: 0; }
  .controles-3d .btn { padding: 6px 10px; font-size: 14px; }
  .dica { display: none !important; }

  /* jornada */
  #m-jornada .palco { height: auto; aspect-ratio: 1000 / 720; min-height: 0; }
  #m-jornada .palco canvas { position: absolute; inset: 0; }
  .controle-anim { left: 8px; right: 8px; bottom: 6px; transform: none; padding: 5px 10px; gap: 8px; font-size: 14px; }
  .controle-anim input { flex: 1; width: auto; min-width: 0; }
  .controle-anim output { min-width: 0; font-size: 14px; }
  .trilha { padding: 8px 10px; position: sticky; top: var(--topo-h, 98px); z-index: 5; background: var(--bancada); }
  .trilha button[aria-current="true"] { flex-basis: 44px; flex-grow: 0; }
  .trilha button[aria-current="true"] span { display: none; }
  .passo-titulo { font-size: 22px; }
  #m-jornada .navegacao { position: sticky; bottom: 0; padding: 10px 0; margin-top: 16px; border-top: 1px solid var(--linha); }
  #m-jornada .navegacao .btn { flex: 1; }

  /* laboratório: gráfico/amostra fixos no topo enquanto ajusta */
  #m-lab.ativo { display: flex; flex-direction: column; }
  #m-lab .area-grafico { order: -1; display: block; position: sticky; top: var(--topo-h, 98px); z-index: 6; background: var(--bancada); padding: 8px 12px 10px; border-bottom: 1px solid var(--linha); }
  #m-lab .area-grafico .legenda { display: none; }
  .lab-abas { display: flex; gap: 4px; margin-bottom: 6px; }
  .lab-abas button { flex: 1; background: var(--painel); border: 1px solid var(--linha); border-radius: 6px; padding: 6px; color: var(--suave); font: 500 14px var(--din); }
  .lab-abas button[aria-pressed="true"] { color: var(--texto); border-color: var(--suave); }
  #m-lab .vista-amostra, #m-lab .grafico { height: 36vh; min-height: 220px; }
  #m-lab .area-grafico[data-aba="grafico"] .vista-amostra, #m-lab .area-grafico[data-aba="amostra"] .grafico { display: none; }
  .lab-mini { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font: 500 14px var(--din); font-variant-numeric: tabular-nums; }
  .lab-mini b { font-weight: 600; }
  .lab-mini .alerta { color: var(--ambar); }

  /* glossário */
  .glossario { padding: 16px 14px 30px; }
  .glo-item { grid-template-columns: 1fr; gap: 6px; }
}
@media (max-width: 420px) { .marca .serie { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.marca a.serie:hover { color: var(--texto); }
.vista-amostra canvas[hidden]{display:none}
.controles-3d label[hidden]{display:none}

.dv.res-d2 td { font-size: 15px; padding: 6px 0; }
.dv.res-d2 td:first-child { color: var(--suave); }

.msg-3d {
  position: absolute; left: 16px; right: 16px; margin-inline: auto; width: fit-content; top: 62px; z-index: 3; max-width: 560px;
  background: color-mix(in srgb, var(--painel) 94%, transparent); border: 1px solid var(--linha); border-left: 3px solid var(--ambar);
  padding: 10px 14px; border-radius: 8px; font-size: 15px;
}
.msg-3d[hidden] { display: none; }
@media (max-width: 900px) { .msg-3d { top: 52px; font-size: 14px; padding: 8px 12px; } }

.campo { position: relative; }
.info-campo { position: static; display: inline-flex; vertical-align: middle; margin-left: 6px; }
.info-btn {
  width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--suave); background: none; color: var(--suave);
  font: 600 12px/1 var(--corpo); padding: 0; cursor: help; display: inline-grid; place-items: center;
}
.info-btn:hover, .info-btn:focus-visible, .info-campo.aberto .info-btn { color: var(--texto); border-color: var(--texto); }
.info-txt {
  display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 15; pointer-events: none;
  background: var(--painel-2); border: 1px solid var(--linha); border-left: 3px solid var(--azul); border-radius: 8px;
  padding: 10px 12px; font: 400 14px/1.45 var(--corpo); color: var(--texto); box-shadow: 0 8px 24px rgb(0 0 0 / .35);
  text-transform: none; letter-spacing: 0; white-space: normal;
}
.info-campo:hover .info-txt, .info-btn:focus-visible + .info-txt, .info-campo.aberto .info-txt { display: block; }
.campo.check { display: flex; align-items: center; flex-wrap: wrap; }

</style>

<body>
<script>
(()=>{var Ac={gota:'<svg class="u-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5C8 1.5 3 7.2 3 10.2a5 5 0 0 0 10 0C13 7.2 8 1.5 8 1.5Z" fill="currentColor"/></svg>',po:'<svg class="u-ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="4" cy="11" r="2" fill="currentColor"/><circle cx="9" cy="12.5" r="1.6" fill="currentColor"/><circle cx="12.5" cy="9.5" r="1.8" fill="currentColor"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/><circle cx="11" cy="4.5" r="1.2" fill="currentColor"/></svg>'};function Rc(n,{fabricas:t,unidades:e,abasExtras:i=[]}){let s=[["m-equip","Equipamento","equip","Equipamento"],["m-jornada","Jornada da amostra","jornada","Jornada"],["m-lab","Laborat\xF3rio","lab","Lab"],["m-glossario","Gloss\xE1rio","glossario","Gloss\xE1rio"]].filter(([S])=>t[S]||i.some(x=>x.id===S)),r=i.filter(S=>!t[S.id]);document.body.innerHTML=`
<header class="topo">
  <svg class="espectro" viewBox="0 0 40 22" aria-hidden="true">
    <circle cx="6" cy="11" r="3.2" fill="#ff4a36"/>
    <path d="M10 11h10" stroke="#ff4a36" stroke-width="2"/>
    <path d="M20 11 L37 3 M20 11 L38 8 M20 11 L38 14 M20 11 L37 19" stroke="#ff4a36" stroke-width="1" opacity=".55"/>
    <circle cx="20" cy="11" r="2.4" fill="#dde4eb"/>
  </svg>
  <div class="marca"><a class="serie" href="index.html" title="Ver todos os equipamentos">${n.meta.serie}</a><h1>${n.meta.titulo}<small> \xB7 ${n.meta.subtitulo}</small></h1></div>
  <nav class="modulos" aria-label="M\xF3dulos">
    ${s.map(([S,x,,v])=>t[S]?`<button data-m="${S}"><span class="nome-longo">${x}</span><span class="nome-curto">${v}</span></button>`:"").join("")}
    ${r.map(S=>`<button disabled title="${S.dica}">${S.nome}</button>`).join("")}
  </nav>
  ${e.length>1?`<div class="seletor-unidade">
    <span class="rot-unidade" id="rot-unidade">M\xF3dulo</span>
    <div class="unidade" role="group" aria-labelledby="rot-unidade">
      ${e.map(S=>`<button data-u="${S.id}">${S.extra==="seco"?Ac.po:Ac.gota}<span>${S.nome}<span class="u-extra"> (${S.extra})</span></span></button>`).join("")}
